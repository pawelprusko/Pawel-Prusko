<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- Global SEO -->
    <title>Pawel Prusko | AI Culinary Art Director &amp; Generative Engineer</title>
    <meta name="description" content="AI Culinary Art Director crafting high-fashion, editorial F&amp;B visuals and motion. Eliminating physical studio constraints for luxury brands and CPG." />

    <link rel="canonical" href="https://pawelprusko.com" />

    <!-- Open Graph / Social Media (LinkedIn) -->
    <meta property="og:type" content="website" />

    <meta property="og:description" content="Eliminating physical studio constraints with Quiet Luxury generative F&amp;B editorial visuals and video." />
    <meta property="og:image" content="https://pawelprusko.com/og-image.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pawel Prusko | AI Culinary Art Director" />
    <meta name="twitter:description" content="Quiet Luxury AI F&amp;B visual production for global brands." />
    <meta name="twitter:image" content="https://pawelprusko.com/og-image.jpg" />

    <!-- Entity Knowledge Graph (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Person",
          "@id": "https://pawelprusko.com/#person",
          "name": "Pawel Prusko",
          "jobTitle": "AI Culinary Art Director & Generative Engineer",
          "url": "https://pawelprusko.com",
          "sameAs": [
            "https://www.linkedin.com/in/pawelprusko"
          ],
          "knowsAbout": [
            "AI Culinary Art",
            "AI Food Photography",
            "Generative Food & Beverage Video and photography Production",
            "Culinary Art Direction",
            "Fluid Dynamics in F&B Video",
            "Quiet Luxury Visual Aesthetics",
            "Virtual Food Styling"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://pawelprusko.com/#website",
          "url": "https://pawelprusko.com",
          "name": "Pawel Prusko Studio",
          "publisher": {
            "@id": "https://pawelprusko.com/#person"
          }
        }
      ]
    }
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F9F2EA" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      html, body {
        background-color: #F9F2EA;
        margin: 0;
        padding: 0;
      }
      #splash-screen {
        position: fixed;
        inset: 0;
        background-color: #F9F2EA;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        transition: opacity 0.6s ease-in-out, visibility 0.6s ease-in-out;
      }
      .splash-logo {
        width: 100px;
        height: 100px;
        position: relative;
        object-fit: contain;
        animation: splash-bounce 2s infinite cubic-bezier(0.28, 0.84, 0.42, 1);
      }
      @keyframes splash-bounce {
        0%, 100% {
          transform: translateY(0);
          animation-timing-function: cubic-bezier(0.8, 0, 1, 1);
        }
        50% {
          transform: translateY(-25%);
          animation-timing-function: cubic-bezier(0, 0, 0.2, 1);
        }
      }
      body.app-loaded #splash-screen {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="splash-screen">
      <img src="/icon-512x512.png" alt="Loading..." class="splash-logo" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(registration => {
            console.log('SW registered: ', registration);
          }).catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
        });
      }
    </script>
  </body>
</html>
